services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qazan-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      APP_ENV: ${APP_ENV:-production}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SQLITE_DB_PATH: /app/backend/data/qazan_trading.db
      LOG_FILE_PATH: /app/backend/logs/qazan_backend.log
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,capacitor://localhost,http://localhost,https://localhost}
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-https://api.binance.com}
      FUTURES_DATA_BASE_URL: ${FUTURES_DATA_BASE_URL:-https://fapi.binance.com}
      OKX_PUBLIC_BASE_URL: ${OKX_PUBLIC_BASE_URL:-https://www.okx.com}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com}
      COINPAPRIKA_BASE_URL: ${COINPAPRIKA_BASE_URL:-https://api.coinpaprika.com}
      ENABLE_BACKGROUND_WS: ${ENABLE_BACKGROUND_WS:-true}
    volumes:
      - qazan_sqlite_data:/app/backend/data
      - qazan_backend_logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qazan-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"

volumes:
  qazan_sqlite_data:
  qazan_backend_logs:
