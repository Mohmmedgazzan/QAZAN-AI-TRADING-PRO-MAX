name: QAZAN-AI-TRADING-PRO-MAX CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend-lint-and-build:
    name: Frontend TypeCheck & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Lint (tsc --noEmit)
        run: npm run lint

      - name: Production Vite Build
        run: npm run build

  backend-pytest-suite:
    name: Backend FastAPI & Quant Pytest Suite
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      ENABLE_BACKGROUND_WS: "false"
      MARKET_DATA_BASE_URL: https://data-api.binance.vision
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run All Backend Pytest Suites (Phases 1-10)
        run: python -m pytest backend/tests -v

  docker-compose-validation:
    name: Docker Compose Config & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose syntax
        run: docker compose config -q

      - name: Build Docker Images (Backend & Frontend)
        run: docker compose build

  android-apk-debug-build:
    name: Android Capacitor Debug APK Build
    runs-on: ubuntu-latest
    needs: [frontend-lint-and-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36 & Build Tools 36.0.0
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies & Sync Capacitor
        run: npm install --no-audit --no-fund && npm run cap:sync

      - name: Build Android Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qazan-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
